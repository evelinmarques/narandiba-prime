<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f2a1d">
<title>Narandiba Prime</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0c1f16;overflow:hidden;overscroll-behavior:none;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;touch-action:none;--u:1px;box-shadow:0 0 40px rgba(0,0,0,.6)}
  canvas#c{display:block;width:100%;height:100%;touch-action:none}
  #ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:calc(var(--u)*14);padding:calc(var(--u)*22);background:rgba(6,18,12,.66);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);text-align:center;font-size:calc(var(--u)*16)}
  #ov.on{display:flex}
  #ov{overflow-y:auto;justify-content:safe center}
  .notice{background:#fff7c2;color:#2b2b1f;border:calc(var(--u)*3) dashed #e0a800;border-radius:calc(var(--u)*14);padding:calc(var(--u)*11) calc(var(--u)*13);text-align:left;width:100%;flex:none}
  .notice b{color:#b5500f}
  .notice>b{display:block;text-align:center;font-size:calc(var(--u)*16);margin-bottom:calc(var(--u)*4)}
  .notice p{font-size:calc(var(--u)*13);line-height:1.35;margin-top:calc(var(--u)*5)}
  .logo{line-height:.9;transform:rotate(-4deg);margin-bottom:calc(var(--u)*4)}
  .logo span{display:block;font-size:calc(var(--u)*46);font-weight:900;letter-spacing:calc(var(--u)*1);
    color:#ffd84d;text-shadow:0 calc(var(--u)*4) 0 #b5500f,0 calc(var(--u)*8) 0 rgba(0,0,0,.35)}
  .logo b{display:block;font-size:calc(var(--u)*50);font-weight:900;letter-spacing:calc(var(--u)*6);
    color:#7cf08a;text-shadow:0 calc(var(--u)*4) 0 #176b2c,0 calc(var(--u)*8) 0 rgba(0,0,0,.35)}
  .sub{font-size:calc(var(--u)*15);opacity:.9;font-weight:700}
  h2{font-size:calc(var(--u)*28);font-weight:900;color:#ffd84d;text-shadow:0 calc(var(--u)*3) 0 rgba(0,0,0,.4)}
  p{font-size:calc(var(--u)*16);line-height:1.35}
  .btn{touch-action:manipulation;border:0;border-radius:calc(var(--u)*16);padding:calc(var(--u)*13) calc(var(--u)*22);
    font:900 calc(var(--u)*18) system-ui,sans-serif;color:#1d2a20;background:#e9f3ea;min-width:calc(var(--u)*230);
    box-shadow:0 calc(var(--u)*5) 0 rgba(0,0,0,.35);cursor:pointer}
  .btn:active{transform:translateY(calc(var(--u)*3));box-shadow:0 calc(var(--u)*2) 0 rgba(0,0,0,.35)}
  .btn.main{background:#ffd84d;font-size:calc(var(--u)*24);padding:calc(var(--u)*16) calc(var(--u)*30)}
  .btn.small{min-width:0;font-size:calc(var(--u)*14);padding:calc(var(--u)*9) calc(var(--u)*16);background:rgba(255,255,255,.16);color:#fff}
  .row{display:flex;gap:calc(var(--u)*10);flex-wrap:wrap;justify-content:center}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*9);width:100%}
  .card{touch-action:manipulation;border:calc(var(--u)*3) solid transparent;border-radius:calc(var(--u)*14);
    background:rgba(255,255,255,.1);color:#fff;padding:calc(var(--u)*6) calc(var(--u)*2) calc(var(--u)*8);
    display:flex;flex-direction:column;align-items:center;font-family:inherit;cursor:pointer}
  .card.sel{border-color:#ffd84d;background:rgba(255,216,77,.2)}
  .card canvas{width:calc(var(--u)*92);height:calc(var(--u)*100)}
  .card b{font-size:calc(var(--u)*13);line-height:1.1}
  .card small{font-size:calc(var(--u)*11);opacity:.75}
  .phase{touch-action:manipulation;width:100%;border:0;border-radius:calc(var(--u)*16);padding:calc(var(--u)*14);
    display:flex;align-items:center;gap:calc(var(--u)*14);text-align:left;font-family:inherit;color:#1d2a20;
    background:#e9f3ea;box-shadow:0 calc(var(--u)*5) 0 rgba(0,0,0,.35);cursor:pointer}
  .phase .ic{font-size:calc(var(--u)*38)}
  .phase b{display:block;font-size:calc(var(--u)*18)}
  .phase small{font-size:calc(var(--u)*13);opacity:.8}
  .plist{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*9);width:100%}
  .plist .phase{padding:calc(var(--u)*9);gap:calc(var(--u)*7);min-height:calc(var(--u)*92);flex-direction:column;text-align:center;justify-content:center}
  .plist .phase .ic{font-size:calc(var(--u)*28)}.plist .phase b{font-size:calc(var(--u)*14)}.plist .phase small{font-size:calc(var(--u)*11)}
  .plist .phase:last-child{grid-column:span 2;min-height:0;flex-direction:row}
  .phase[disabled]{opacity:.45;filter:grayscale(1)}
  .dlg{display:flex;gap:calc(var(--u)*10);align-items:flex-end;background:#fffdf2;color:#24322a;
    border-radius:calc(var(--u)*18);padding:calc(var(--u)*12);text-align:left;width:100%;
    box-shadow:0 calc(var(--u)*6) 0 rgba(0,0,0,.3)}
  .dlg canvas{width:calc(var(--u)*86);height:calc(var(--u)*96);flex:none}
  .dlg b{color:#b5500f;font-size:calc(var(--u)*15)}
  .dlg p{font-size:calc(var(--u)*15);margin-top:calc(var(--u)*3)}
  .how{background:rgba(255,255,255,.12);border-radius:calc(var(--u)*14);padding:calc(var(--u)*12);font-size:calc(var(--u)*15);line-height:1.4;width:100%}
  .grp{width:calc(var(--u)*340);height:calc(var(--u)*130)}
  .disc{font-size:calc(var(--u)*11);opacity:.8;line-height:1.35;max-width:calc(var(--u)*320);font-style:italic}
  .big{font-size:calc(var(--u)*54)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="ov"></div>
</div>
<script>
(()=>{
const W=400,H=700;
const wrap=document.getElementById('wrap'),cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
let scale=1,dpr=1;
function resize(){
  const vw=window.innerWidth,vh=window.innerHeight;
  let w=vw,h=vw*H/W; if(h>vh){h=vh;w=vh*W/H;}
  wrap.style.width=w+'px';wrap.style.height=h+'px';
  dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  scale=w/W; wrap.style.setProperty('--u',scale+'px');
  if(ov.classList.contains('on')) renderPortraits();
}
window.addEventListener('resize',resize);
// ---------- utils ----------
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function ell(g,x,y,rx,ry){g.beginPath();g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);}
function circ(g,x,y,r){g.beginPath();g.arc(x,y,Math.max(.1,r),0,Math.PI*2);}
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;}
function otext(g,s,x,y,size,col,align='center',stroke='#14201a'){
  g.font=`900 ${size}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;g.textAlign=align;g.textBaseline='middle';
  g.lineJoin='round';g.lineWidth=size/4;g.strokeStyle=stroke;g.strokeText(s,x,y);g.fillStyle=col;g.fillText(s,x,y);}
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
// ---------- save ----------
let save={unlocked:9,hero:'saulo',sound:true,music:true,diff:1,done:{}};
try{const s=JSON.parse(localStorage.getItem('imbuiPrime')||'null');if(s)save=Object.assign(save,s);}catch(e){}
if(save.hero==='paulo')save.hero='saulo';if(save.hero==='tiago')save.hero='iago';
function persist(){try{localStorage.setItem('imbuiPrime',JSON.stringify(save))}catch(e){}}
// ---------- sound ----------
let AC=null;
function unlockAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();musicInit();}catch(e){}}
function beep(f=440,d=.1,type='square',v=.05,slide=0){
  if(!save.sound||!AC)return;
  try{const o=AC.createOscillator(),gn=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
function jingle(){duckMusic(1.6);[[523,0],[659,90],[784,180],[1046,270],[784,400],[1046,490],[1318,600]].forEach(([f,d])=>setTimeout(()=>{beep(f,.16,'square',.05);beep(f/2,.16,'triangle',.05);},d));}
function sadTune(){duckMusic(1.6);[392,330,262].forEach((f,i)=>setTimeout(()=>beep(f,.25,'triangle',.06),i*180));}
// ---------- characters ----------
const CHARS=[
 {id:'saulo',name:'Saulo',role:'Síndico',skin:'#e6b08a',hair:'buzz',hairC:'#2b1d14',shirt:'#f6f6f6',pants:'#2d3440',tie:'#d0312d',belly:1.55},
 {id:'iago',name:'Iago',role:'Subsíndico',skin:'#8a5534',hair:'bald',fullBald:true,hairC:'#2a1a10',shirt:'#3b7dd8',pants:'#2b2f3a',belly:1},
 {id:'cons1',name:'Freida',role:'Moradora',skin:'#8d5a3b',hair:'curly',hairC:'#1d120c',shirt:'#e84a8a',pants:'#5a3f86',belly:1,female:true},
 {id:'cons2',name:'Osvaldo',role:'Morador',skin:'#f0c39b',hair:'bald',hairC:'#6b4a2e',shirt:'#2e9e6a',pants:'#33363d',belly:1.15,beard:true},
 {id:'cons3',name:'Maya',role:'Moradora',skin:'#d9a07a',hair:'long',hairC:'#5a3a22',shirt:'#8e5cc9',pants:'#2b2f3a',belly:1,glasses:true,female:true},
 {id:'cons4',name:'Adones',role:'Morador',skin:'#6e4630',hair:'cap',hairC:'#121212',capC:'#f1c40f',shirt:'#1f8fb3',pants:'#3a3a3a',belly:1},
];
const charById=id=>CHARS.find(c=>c.id===id)||CHARS[0];
const hero=()=>charById(save.hero);
function speaker(pref,alt){return save.hero===pref?alt:pref;}

function drawPerson(g,x,y,s,c,o={}){
  g.save();g.translate(x,y);g.scale(s,s);if(o.flip)g.scale(-1,1);
  const t=o.t||0,b=c.belly||1,bw=18*b;
  const sw=o.walking?Math.sin(t*11)*3:0;
  const bob=o.walking?Math.abs(Math.sin(t*11))*1.6:(o.armsUp?Math.abs(Math.sin(t*7))*4:0);
  g.fillStyle='rgba(0,0,0,.2)';ell(g,0,1,bw*.75+4,4);g.fill();
  g.translate(0,-bob);
  // curly back hair
  if(c.hair==='long'){g.fillStyle=c.hairC;rr(g,-16,-64,32,30,9);g.fill();}
  if(c.hair==='curly'){g.fillStyle=c.hairC;
    for(let a=0;a<Math.PI*2;a+=Math.PI/7){const yy=-56+Math.sin(a)*14;if(yy>-40)continue;circ(g,Math.cos(a)*16,yy,8.5);g.fill();}
    circ(g,-15,-44,7.5);g.fill();circ(g,15,-44,7.5);g.fill();}
  // legs
  g.fillStyle=c.female?c.skin:c.pants;
  rr(g,-8+sw*.5,-19,7,18,2);g.fill();rr(g,1-sw*.5,-19,7,18,2);g.fill();
  g.fillStyle='#1d1d1d';ell(g,-4.5+sw*.5,-1.5,5,2.6);g.fill();ell(g,4.5-sw*.5,-1.5,5,2.6);g.fill();
  // arms (behind when up)
  const armUp=(side)=>{const wv=Math.sin(t*9+(side>0?1.5:0))*3;g.fillStyle=c.shirt;rr(g,side*(bw/2+1)-3,-64+wv,6,22,3);g.fill();
    g.fillStyle=c.skin;circ(g,side*(bw/2+1),-65+wv,3.8);g.fill();};
  if(o.armsUp){armUp(-1);armUp(1);}
  // body
  g.fillStyle=c.shirt;rr(g,-bw/2,-45,bw,29,8);g.fill();
  if(b>1.2){ell(g,0,-29,bw/2+1.5,13.5);g.fill();g.fillStyle='rgba(0,0,0,.08)';ell(g,0,-25,bw/2-3,7);g.fill();}
  if(c.female){g.fillStyle=c.pants;g.beginPath();g.moveTo(-bw/2,-24);g.lineTo(-bw/2-5,-11);g.lineTo(bw/2+5,-11);g.lineTo(bw/2,-24);g.closePath();g.fill();}
  else{g.fillStyle='rgba(0,0,0,.25)';g.fillRect(-bw/2+1,-19,bw-2,2.5);}
  if(c.tie){g.fillStyle='#fff';g.beginPath();g.moveTo(-6,-45);g.lineTo(0,-40);g.lineTo(6,-45);g.closePath();g.fill();
    g.fillStyle=c.tie;rr(g,-2.6,-44,5.2,4.2,1);g.fill();g.beginPath();g.moveTo(-3,-40);g.lineTo(3,-40);g.lineTo(4.2,-25);g.lineTo(0,-20);g.lineTo(-4.2,-25);g.closePath();g.fill();}
  if(c.vest){g.fillStyle='#f6e04b';g.fillRect(-bw/2+2,-36,bw-4,3);g.fillRect(-bw/2+2,-28,bw-4,3);}
  if(!o.armsUp){g.fillStyle=c.shirt;rr(g,-bw/2-5,-43,6,21,3);g.fill();rr(g,bw/2-1,-43,6,21,3);g.fill();
    g.fillStyle=c.skin;circ(g,-bw/2-2,-21,3.6);g.fill();circ(g,bw/2+2,-21,3.6);g.fill();}
  if(o.saw){const j=o.cutting?rand(-1.2,1.2):0;g.save();g.translate(bw/2+2,-24+j);
    g.fillStyle='#e8681a';rr(g,-2,-5,15,10,2);g.fill();g.fillStyle='#9aa3ab';rr(g,12,-3,20,6,3);g.fill();
    g.fillStyle='#5d656c';for(let i=0;i<5;i++)g.fillRect(14+i*3.6,-4.5,1.6,1.6);g.restore();}
  // head
  g.fillStyle=c.skin;circ(g,-14,-55,3.2);g.fill();circ(g,14,-55,3.2);g.fill();circ(g,0,-56,14);g.fill();
  g.fillStyle=c.hairC;
  if(c.hair==='buzz'){g.beginPath();g.arc(0,-56,14.8,Math.PI*1.13,Math.PI*1.87);g.closePath();g.fill();
    g.globalAlpha=.35;g.beginPath();g.arc(0,-56,14.6,Math.PI*1.02,Math.PI*1.98);g.closePath();g.fill();g.globalAlpha=1;}
  else if(c.hair==='long'){g.beginPath();g.arc(0,-56,15,Math.PI*.98,Math.PI*2.02);g.closePath();g.fill();ell(g,4,-66,10,5);g.fill();}
  else if(c.hair==='side'){g.beginPath();g.arc(0,-56,15,Math.PI*.98,Math.PI*2.02);g.closePath();g.fill();ell(g,-5,-67,9,5);g.fill();
    g.beginPath();g.moveTo(-14,-58);g.quadraticCurveTo(-4,-58,4,-66);g.lineTo(-10,-66);g.closePath();g.fill();}
  else if(c.hair==='curly'){for(let a=Math.PI*1.02;a<=Math.PI*1.99;a+=Math.PI/8){circ(g,Math.cos(a)*12,-56+Math.sin(a)*12,6.2);g.fill();}}
  else if(c.hair==='bald'){if(!c.fullBald){ell(g,-13.5,-54,3,6);g.fill();ell(g,13.5,-54,3,6);g.fill();}g.fillStyle='rgba(255,255,255,.4)';ell(g,-4,-66,4,2.2);g.fill();}
  else if(c.hair==='cap'){g.fillStyle=c.hairC;ell(g,-13,-55,2.5,5);g.fill();ell(g,13,-55,2.5,5);g.fill();
    g.fillStyle=c.capC;g.beginPath();g.arc(0,-57,15.4,Math.PI,Math.PI*2);g.closePath();g.fill();g.fillStyle='rgba(0,0,0,.2)';ell(g,0,-57,16.5,3.4);g.fill();
    g.fillStyle=c.capC;ell(g,3,-57.5,17,3);g.fill();}
  // face
  if(c.beard){g.fillStyle=c.hairC;g.globalAlpha=.9;g.beginPath();g.arc(0,-55,14,Math.PI*.08,Math.PI*.92);g.quadraticCurveTo(0,-43,13.9,-53);g.fill();g.globalAlpha=1;}
  g.fillStyle='#1b1b1b';
  if(o.scared){circ(g,-5,-54,2.4);g.fill();circ(g,5,-54,2.4);g.fill();}
  else{circ(g,-5,-54,1.9);g.fill();circ(g,5,-54,1.9);g.fill();}
  g.fillStyle='#fff';circ(g,-4.4,-54.7,.7);g.fill();circ(g,5.6,-54.7,.7);g.fill();
  if(o.angry){g.strokeStyle='#1b1b1b';g.lineWidth=1.4;g.beginPath();g.moveTo(-8,-59.5);g.lineTo(-2.5,-57.5);g.moveTo(8,-59.5);g.lineTo(2.5,-57.5);g.stroke();}
  g.fillStyle='rgba(255,105,105,.35)';circ(g,-8.5,-49.5,2.6);g.fill();circ(g,8.5,-49.5,2.6);g.fill();
  g.strokeStyle='#5a2a1a';g.lineWidth=1.5;g.lineCap='round';g.beginPath();
  if(o.scared){g.fillStyle='#5a2a1a';ell(g,0,-47.5,2.6,3.2);g.fill();}
  else if(o.angry){g.arc(0,-45,3.6,Math.PI*1.2,Math.PI*1.8);g.stroke();}
  else{g.arc(0,-50,4.2,Math.PI*.15,Math.PI*.85);g.stroke();}
  if(c.glasses){g.strokeStyle='#222';g.lineWidth=1.3;circ(g,-5,-54,4.3);g.stroke();circ(g,5,-54,4.3);g.stroke();g.beginPath();g.moveTo(-.8,-54);g.lineTo(.8,-54);g.stroke();}
  g.restore();
}
const BADGUY_SKINS=['#c58c5c','#e0b48e','#8a5a3c','#f0c9a2'];
function badGuy(){return{skin:pick(BADGUY_SKINS),hair:'cap',hairC:'#222',capC:pick(['#e67e22','#c0392b','#7f8c8d']),shirt:'#e67e22',pants:'#34495e',belly:rand(1,1.3),beard:Math.random()<.5,vest:true};}
const RESIDENTS=[{skin:'#d9a07a',hair:'side',hairC:'#4a2f1c',shirt:'#e74c3c',pants:'#2c3e50'},{skin:'#7a4b31',hair:'curly',hairC:'#111',shirt:'#f39c12',pants:'#34495e',female:true}];

// ---------- portraits ----------
function renderPortraits(){
  ov.querySelectorAll('canvas[data-por]').forEach(el=>{
    const cw=el.clientWidth,ch=el.clientHeight;if(!cw||!ch)return;
    el.width=Math.round(cw*dpr);el.height=Math.round(ch*dpr);
    const g=el.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,cw,ch);
    const id=el.dataset.por;
    if(id==='group'){const s=ch/88;const xs=[.1,.27,.43,.58,.74,.9];
      CHARS.forEach((c,i)=>drawPerson(g,cw*xs[i],ch*.97-(i%2)*4*s,s*.95,c,{armsUp:true,t:i*.7}));}
    else{const s=ch/80;drawPerson(g,cw/2,ch*.97,s,charById(id),{});}
  });
}
// ---------- overlay ----------
function show(html){ov.innerHTML=html;ov.classList.add('on');renderPortraits();}
function hide(){ov.classList.remove('on');ov.innerHTML='';}
ov.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;unlockAudio();beep(660,.06,'triangle',.05);act(b.dataset.act,b.dataset);});

let state='menu',phase=null,curPhase=1,fx=[],banner=null;
function act(a,d){
  if(a==='title')showTitle();
  else if(a==='chars')showChars();
  else if(a==='pick'){save.hero=d.id;persist();showChars();}
  else if(a==='phases')showPhases();
  else if(a==='sound'){save.sound=!save.sound;persist();showTitle();}
  else if(a==='music'){save.music=!save.music;persist();if(d.from==='pause'){state='play';pauseGame();}else showTitle();}
  else if(a==='phase')startPhase(+d.n);
  else if(a==='start'){hide();state='play';}
  else if(a==='resume'){hide();state='play';}
  else if(a==='retry')startPhase(curPhase);
  else if(a==='next'){if(curPhase<PH.length)startPhase(curPhase+1);else showEnding();}
  else if(a==='menu'){phase=null;state='menu';showTitle();}
  else if(a==='map')showMap();
}
function showTitle(){
  state='menu';phase=null;
  show(`<div class="logo"><span>NARANDIBA</span><b>PRIME</b></div>
  <div class="sub">A aventura do condomínio</div>
  <canvas class="grp" data-por="group"></canvas>

    for(const t of P.trees){if(t.state==='cut'){drawStump(g,t.x,G,t.s);drawTree(g,t.x+t.fdir*6,G-4,t.s,{rot:t.rot});}

function driveCar(P,dt){
  const c=P.car;P.scrape-=dt;
  const m=Math.min(1,Math.hypot(input.jx,input.jy));
  if(m>.15){const ta=Math.atan2(input.jy,input.jx);const turn=4.2*Math.min(1,.45+Math.abs(c.v)/90);
    const da=angDiff(ta,c.a);c.a+=clamp(da,-turn*dt,turn*dt);const want=m*155*(Math.abs(da)>2.2?.35:1);c.v+=(want-c.v)*Math.min(1,dt*3);}
  else c.v*=1-Math.min(1,dt*5);
  c.x+=Math.cos(c.a)*c.v*dt;c.y+=Math.sin(c.a)*c.v*dt;
  let hit=false;
  for(let it=0;it<2;it++){for(const [px,py] of carCircles(c)){const r=12;
    for(const s of P.spots){if(!s.occ)continue;const rx=s.x+5,ry=s.y+6,rw=s.w-10,rh=s.h-12;
      const qx=clamp(px,rx,rx+rw),qy=clamp(py,ry,ry+rh);let dx=px-qx,dy=py-qy,d=Math.hypot(dx,dy);
      if(d<r){if(d<.01){dy=(py<s.y+s.h/2)?-1:1;dx=0;d=1;}const push=(r-d);c.x+=dx/d*push;c.y+=dy/d*push;hit=true;}}
    if(px<r){c.x+=r-px;hit=true;}if(px>W-r){c.x-=px-(W-r);hit=true;}if(py<48+r){c.y+=48+r-py;hit=true;}if(py>H-r){c.y-=py-(H-r);hit=true;}}}
  if(hit){c.v*=.85;if(P.scrape<=0&&Math.abs(c.v)>40){beep(90,.06,'sawtooth',.03);P.scrape=.25;}}
}

    if(P.money>=P.goal){P.stage='win';P.endT=0;setBanner('META BATIDA! 💰','#7cf08a');confetti(200,360,60);
      P.cust.forEach(o=>{if(o.state==='wait'||o.state==='walk'){o.state='happy';o.dir=o.x<200?-1:1;}});P.stalls.forEach(st=>st.q=[]);}}

      const db=Math.hypot(x-c.x,y-by),inBody=Math.abs(x-c.x)<22&&y>by-20&&y<c.y+6;
      if(db<26||inBody){const d=Math.min(db,Math.abs(x-c.x)+Math.abs(y-(c.y-30))*.5);if(d<bd){bd=d;best=c;}}}

  P.update=dt=>{P.t+=dt;if(pendTick(P,dt))return;

// =================== FINAL PHASE: QUADRA ===================
function Phase3(){
  const C={x:70,y:190,w:260,h:340};

  P.vines=[];for(let i=0;i<80;i++)P.vines.push({x:rand(C.x,C.x+C.w),y:rand(C.y,C.y+C.h),r:rand(10,22),c:pick(['#2f6f2c','#3d8a35','#24561f','#4a9a3c']),k:Math.random()});

  function edgePos(){const s=Math.floor(Math.random()*4);if(s===0)return{x:rand(40,360),y:70};if(s===1)return{x:rand(40,360),y:690};if(s===2)return{x:16,y:rand(100,650)};return{x:384,y:rand(100,650)};}
  function spawn(type,pos){const p=pos||edgePos();P.en.push({type,x:p.x,y:p.y,hp:type==='snake'?2:1,r:type==='snake'?13:11,sp:(type==='snake'?rand(44,60):rand(80,102))*DF.k,t:rand(0,9),ang:0,jt:0,hit:0,a:0});}
  const pl=P.pl;
  function hurt(e){if(pl.inv>0||P.stage!=='fight'&&P.stage!=='boss')return;pl.hp--;pl.inv=1.3;vib(90);beep(150,.25,'sawtooth',.06,-60);burst(pl.x,pl.y-30,'#ff5a5a',10,140);
    const dx=pl.x-e.x,dy=pl.y-e.y,d=Math.hypot(dx,dy)||1;pl.x+=dx/d*26;pl.y+=dy/d*26;txt(pl.x,pl.y-80,'Ai!','#ff8080',18);
    if(pl.hp<=0){P.stage='lost';P.pend={t:1.2,fn:()=>losePhase('Os bichos da selva venceram dessa vez!')};}}
  P.update=dt=>{
    P.t+=dt;P.hint-=dt;
    if(P.pend){P.pend.t-=dt;if(P.pend.t<=0){const f=P.pend.fn;P.pend=null;f();return;}}
    const fighting=P.stage==='fight'||P.stage==='boss';
    // player
    pl.t+=dt;pl.inv=Math.max(0,pl.inv-dt);
    if(fighting){const m=Math.min(1,Math.hypot(input.jx,input.jy));pl.moving=m>.12;
      if(pl.moving){pl.x+=input.jx/Math.max(1,Math.hypot(input.jx,input.jy))*m*165*dt;pl.y+=input.jy/Math.max(1,Math.hypot(input.jx,input.jy))*m*165*dt;if(Math.abs(input.jx)>.1)pl.face=input.jx>0?1:-1;}
      pl.x=clamp(pl.x,40,360);pl.y=clamp(pl.y,100,665);
      // fire
      pl.fire-=dt;if(pl.fire<=0){let best=null,bd=290;for(const e of P.en){const d=Math.hypot(e.x-pl.x,e.y-(pl.y-30));if(d<bd){bd=d;best=e;}}
        if(best){const ox=pl.x,oy=pl.y-34,dx=best.x-ox,dy=best.y-oy,d=Math.hypot(dx,dy)||1;P.sh.push({x:ox,y:oy,vx:dx/d*380,vy:dy/d*380,rot:0,life:1});pl.fire=.3;pl.face=dx>0?1:-1;beep(720,.04,'triangle',.025,-300);}}
      // spawn

      for(const e of P.en){if(e.dead)continue;if(Math.hypot(e.x-s.x,e.y-s.y)<e.r+7){s.life=0;e.hp--;e.hit=.12;const d=Math.hypot(s.vx,s.vy)||1;
        if(e.type!=='boss'){e.x+=s.vx/d*8;e.y+=s.vy/d*8;}burst(s.x,s.y,'#fff',4,80,2);
        if(e.hp<=0){e.dead=true;beep(e.type==='boss'?80:300,e.type==='boss'?.6:.08,'square',.05,-150);
          burst(e.x,e.y,e.type==='snake'?'#5cc94f':'#5b3b7a',e.type==='boss'?50:12,e.type==='boss'?220:130,e.type==='boss'?6:3);

            P.en.forEach(o=>{if(!o.dead){o.dead=true;burst(o.x,o.y,'#5cc94f',8,100);}});}

    P.sh=P.sh.filter(s=>s.life>0&&s.x>-20&&s.x<420&&s.y>-20&&s.y<720);

      const dx=pl.x-e.x,dy=(pl.y-22)-e.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;let vx,vy;

        const ca=Math.cos(e.ang),sa=Math.sin(e.ang),sp=e.sp*(e.type==='spider'?(.6+.6*Math.abs(Math.sin(e.t*3))):1);vx=(ux*ca-uy*sa)*sp;vy=(ux*sa+uy*ca)*sp;}
      if(e.type==='boss'){e.spawnT-=dt;if(e.spawnT<=0){e.spawnT=2.6;spawn('spider',{x:e.x-30,y:e.y+10});spawn('spider',{x:e.x+30,y:e.y+10});}}
      e.x+=vx*dt;e.y+=vy*dt;e.a=Math.atan2(vy,vx);
      if(d<e.r+13)hurt(e);}
    P.en=P.en.filter(e=>!e.dead);
    // items
    for(const it of P.items){it.t+=dt;if(Math.hypot(it.x-pl.x,it.y-(pl.y-15))<26&&!it.got){it.got=true;pl.hp=Math.min(pl.max,pl.hp+1);txt(it.x,it.y-20,'Coxinha! +1 ❤️','#ffd84d',15);beep(880,.1,'triangle',.05,400);}}
    P.items=P.items.filter(i=>!i.got&&i.t<9);
    if(P.stage==='clear'){P.endT+=dt;if(P.endT>3.8)winPhase('A quadra é dos moradores!');}
  };
  function drawSnake(g,e){g.save();g.translate(e.x,e.y);g.rotate(e.a);
    for(let i=6;i>=0;i--){const ox=-i*6,oy=Math.sin(e.t*9-i*.9)*4;g.fillStyle=e.hit>0?'#fff':(i%2?'#3fae3a':'#57c84c');circ(g,ox,oy,7.5-i*.6);g.fill();if(i%2===0&&i>0){g.fillStyle='#f1d649';circ(g,ox,oy,2);g.fill();}}
    g.fillStyle=e.hit>0?'#fff':'#2f8f2c';ell(g,5,0,9,7);g.fill();g.fillStyle='#fff';circ(g,8,-3.5,2.4);g.fill();circ(g,8,3.5,2.4);g.fill();g.fillStyle='#111';circ(g,8.8,-3.5,1.2);g.fill();circ(g,8.8,3.5,1.2);g.fill();
    if(Math.sin(e.t*7)>0){g.strokeStyle='#e33';g.lineWidth=1.4;g.beginPath();g.moveTo(13,0);g.lineTo(19,0);g.lineTo(21,-2);g.moveTo(19,0);g.lineTo(21,2);g.stroke();}
    g.restore();}
  function drawSpider(g,e,s=1){g.save();g.translate(e.x,e.y);g.rotate(e.a);g.scale(s,s);
    g.strokeStyle=e.hit>0?'#fff':(e.type==='boss'?'#3a1650':'#1a1a1a');g.lineWidth=2.2;g.lineCap='round';
    for(let side=-1;side<=1;side+=2)for(let i=0;i<4;i++){const ph=Math.sin(e.t*16+i*1.6+(side>0?1:0))*3;const bx=4-i*3.5,kx=bx+4-i*2+ph,ky=side*12,fx2=bx+2-i*4+ph,fy=side*19;
      g.beginPath();g.moveTo(bx,side*3);g.lineTo(kx,ky);g.lineTo(fx2,fy);g.stroke();}
    g.fillStyle=e.hit>0?'#fff':(e.type==='boss'?'#5b2a7a':'#222');ell(g,-5,0,9,7.5);g.fill();circ(g,5,0,5.5);g.fill();
    if(e.type==='boss'){g.fillStyle='#ff8af0';ell(g,-6,0,4,3);g.fill();}
    g.fillStyle='#ff3b3b';circ(g,8,-2.2,1.5);g.fill();circ(g,8,2.2,1.5);g.fill();circ(g,6,-3.6,1);g.fill();circ(g,6,3.6,1);g.fill();
    g.restore();
    if(e.type==='boss'){g.save();g.translate(e.x,e.y-34);g.fillStyle='#ffd84d';g.beginPath();g.moveTo(-14,6);g.lineTo(-14,-6);g.lineTo(-7,0);g.lineTo(0,-9);g.lineTo(7,0);g.lineTo(14,-6);g.lineTo(14,6);g.closePath();g.fill();g.restore();}}
  function drawChinelo(g,s){g.save();g.translate(s.x,s.y);g.rotate(s.rot);g.fillStyle='#2f6fe0';ell(g,0,0,9,4.6);g.fill();g.fillStyle='#fff';g.fillRect(-1,-4,2,8);g.strokeStyle='#fff';g.lineWidth=1.6;g.beginPath();g.moveTo(-3,-4);g.lineTo(2,0);g.lineTo(-3,4);g.stroke();g.restore();}
  function drawCoxinha(g,it){const b=Math.sin(it.t*5)*3;g.save();g.translate(it.x,it.y+b);g.fillStyle='rgba(0,0,0,.2)';ell(g,0,10-b,9,3);g.fill();
    g.fillStyle='#d98a2b';g.beginPath();g.moveTo(0,-12);g.quadraticCurveTo(11,2,8,7);g.quadraticCurveTo(0,12,-8,7);g.quadraticCurveTo(-11,2,0,-12);g.fill();
    g.fillStyle='#f0b25a';ell(g,-2,0,3,5);g.fill();g.restore();}
  P.draw=g=>{
    g.fillStyle='#4e8f3a';g.fillRect(0,0,W,H);g.fillStyle='rgba(0,0,0,.06)';for(let i=0;i<90;i++)g.fillRect((i*67)%400,(i*131)%700,4,4);
    const prog=P.stage==='clear'?1:P.stage==='boss'?.95:P.kills/P.goal*.9;
    // court
    g.fillStyle='#c4733f';g.fillRect(C.x-10,C.y-10,C.w+20,C.h+20);g.fillStyle='#2f6db5';g.fillRect(C.x,C.y,C.w,C.h);
    g.strokeStyle='#fff';g.lineWidth=3;g.strokeRect(C.x+6,C.y+6,C.w-12,C.h-12);g.beginPath();g.moveTo(C.x+6,C.y+C.h/2);g.lineTo(C.x+C.w-6,C.y+C.h/2);g.stroke();
    circ(g,C.x+C.w/2,C.y+C.h/2,34);g.stroke();g.strokeRect(C.x+C.w/2-45,C.y+6,90,50);g.strokeRect(C.x+C.w/2-45,C.y+C.h-56,90,50);

  };
  P.hud=g=>{hudBar(g,'FASE '+curPhase,P.stage==='fight'?`Bichos ${P.kills}/${P.goal}`:P.stage==='boss'?'CHEFÃO!':'Vitória!','');

// ---------- input ----------
const input={jx:0,jy:0,joy:null},keys={};
function toL(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlockAudio();if(state==='map'){const q=toL(e);mapTap(q.x,q.y);return;}if(state!=='play'||!phase)return;const p=toL(e);
  if(p.x>344&&p.y<50){pauseGame();return;}
  if(phase.usesJoy){if(!input.joy){input.joy={id:e.pointerId,ox:p.x,oy:p.y,x:p.x,y:p.y};try{cv.setPointerCapture(e.pointerId)}catch(_){}}}
  else phase.onTap&&phase.onTap(p.x,p.y);});
cv.addEventListener('pointermove',e=>{if(input.joy&&e.pointerId===input.joy.id){const p=toL(e);input.joy.x=p.x;input.joy.y=p.y;}});
const endJoy=e=>{if(input.joy&&e.pointerId===input.joy.id)input.joy=null;};

// ---------- música (chiptune em loop) ----------
const LEAD=[76,79,84,79,76,79,81,79, 74,79,83,79,74,71,74,79, 72,76,81,76,84,83,81,76, 77,81,84,81,79,77,76,74,
            84,0,83,84,79,0,76,79, 83,0,81,83,79,0,74,79, 81,0,79,81,76,0,72,76, 77,79,81,83,84,0,86,0];
const ROOTS=[48,43,45,41,48,43,45,43];
const TRANS=[0,2,-3,5,-1,3,-2,4,-5];
const Music={next:0,step:0,tempo:132,tr:0,gain:null,noise:null,duckUntil:0};
const mf=n=>440*Math.pow(2,(n-69)/12);
function musicInit(){if(!AC||Music.gain)return;Music.gain=AC.createGain();Music.gain.gain.value=0;Music.gain.connect(AC.destination);
  const len=AC.sampleRate*.3,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;Music.noise=buf;}
function mTone(f,t,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(Music.gain);o.start(t);o.stop(t+d+.02);}
function mNoise(t,d,v,hp){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=Music.noise;f.type='highpass';f.frequency.value=hp;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(Music.gain);s.start(t);s.stop(t+d+.02);}
function mKick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
  g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(Music.gain);o.start(t);o.stop(t+.2);}
function musicTick(){
  if(!AC||!Music.gain)return;
  const playing=save.music&&state!=='pause'&&!document.hidden;
  const target=playing?(AC.currentTime<Music.duckUntil?.15:1):0;
  Music.gain.gain.setTargetAtTime(target,AC.currentTime,.08);
  if(!playing){Music.next=0;return;}
  const inGame=!!phase;Music.tempo=inGame?160:136;Music.tr=inGame?TRANS[(curPhase-1)%TRANS.length]:0;
  if(Music.next<AC.currentTime)Music.next=AC.currentTime+.05;
  const spb=60/Music.tempo/2;
  while(Music.next<AC.currentTime+.2){
    const s=Music.step%64,bar=Math.floor(s/8),t=Music.next,L=LEAD[s],r=ROOTS[bar]+Music.tr;
    if(L){mTone(mf(L+Music.tr),t,spb*.95,'square',.05);mTone(mf(L+Music.tr+12),t,spb*.5,'triangle',.02);}
    mTone(mf(s%2?r+12:r),t,spb*.85,'triangle',.16);
    if(s%8===3||s%8===7){[0,4,7].forEach(iv=>mTone(mf(r+24+iv+(bar%4===2&&iv===4?-1:0)),t,spb*.45,'square',.012));}
    if(s%4===0)mKick(t);
    if(s%8===4)mNoise(t,.13,.22,1200);
    mNoise(t,.035,s%2?.05:.08,7000);
    Music.next+=spb;Music.step++;
  }
}
setInterval(musicTick,25);
function duckMusic(sec){if(AC)Music.duckUntil=AC.currentTime+sec;}

document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame();});
document.addEventListener('gesturestart',e=>e.preventDefault());
function readInput(){
  if(input.joy){const j=input.joy,R=46;let dx=j.x-j.ox,dy=j.y-j.oy,m=Math.hypot(dx,dy);
    if(m>R){j.ox=j.x-dx/m*R;j.oy=j.y-dy/m*R;dx=j.x-j.ox;dy=j.y-j.oy;m=R;}input.jx=dx/R;input.jy=dy/R;}
  else{let x=0,y=0;if(keys['arrowleft']||keys['a'])x--;if(keys['arrowright']||keys['d'])x++;if(keys['arrowup']||keys['w'])y--;if(keys['arrowdown']||keys['s'])y++;
    const m=Math.hypot(x,y)||1;input.jx=x/m;input.jy=y/m;}
}
function drawJoy(g){if(!input.joy)return;const j=input.joy;g.fillStyle='rgba(255,255,255,.14)';circ(g,j.ox,j.oy,46);g.fill();g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=2;g.stroke();
  g.fillStyle='rgba(255,255,255,.55)';circ(g,j.ox+input.jx*46,j.oy+input.jy*46,20);g.fill();}

// ---------- loop ----------
let last=performance.now(),T=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  if(state==='play'&&phase){readInput();phase.update(dt);updFx(dt);}
  if(phase){phase.draw(ctx);drawFx(ctx);if(state==='play'||state==='won'||state==='over'){phase.hud(ctx);}if(state==='play')drawJoy(ctx);}
  else if(state==='map'){mapUpdate(dt);drawMap(ctx);}
  else drawMenuBg(ctx,T);
  requestAnimationFrame(loop);
}
resize();showTitle();requestAnimationFrame(loop);
})();
</script>
